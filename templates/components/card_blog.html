<article class="bg-white border-2 border-shield-navy transition-all duration-200 flex flex-col h-full group">
    <div class="p-6 flex flex-col flex-grow z-10">
        <span class="text-xs font-mono font-bold uppercase tracking-widest bg-shield-ice text-shield-navy px-2.5 py-1 border-2 border-shield-navy self-start mb-3">{{ post.category }}</span>

        <h3 class="font-display text-2xl font-bold text-shield-navy mb-2 uppercase tracking-tight group-hover:text-shield-blue transition-colors">
            <a href="{{ post.get_absolute_url }}">{{ post.title }}</a>
        </h3>

        <p class="font-body text-shield-navy text-sm font-medium flex-grow mb-4 leading-relaxed line-clamp-3">{{ post.excerpt }}</p>

        <div class="flex items-center justify-between mt-auto pt-4 border-t-2 border-shield-navy font-mono text-xs font-bold text-shield-navy">
            <span>{{ post.author }}</span>
            <time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"M d, Y" }}</time>
        </div>
    </div>
</article>
