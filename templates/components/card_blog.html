<article class="comic-card group flex flex-col h-full">
    <div class="relative h-2 bg-gradient-to-r from-shield-red via-shield-navy to-shield-ice"></div>
    <div class="p-6 flex flex-col flex-grow z-10">
        <span class="text-xs font-display font-semibold uppercase tracking-wider text-shield-silver mb-2">{{ post.category }}</span>

        <h3 class="font-display text-xl font-bold text-white mb-2 group-hover:text-shield-ice transition-colors">
            <a href="{{ post.get_absolute_url }}">{{ post.title }}</a>
        </h3>

        <p class="text-gray-400 text-sm flex-grow mb-4 line-clamp-3">{{ post.excerpt }}</p>

        <div class="flex items-center justify-between mt-auto pt-4 border-t border-white/5 text-xs text-gray-500">
            <span>{{ post.author }}</span>
            <time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"M d, Y" }}</time>
        </div>
    </div>
</article>
