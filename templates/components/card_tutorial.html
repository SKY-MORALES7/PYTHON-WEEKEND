<article class="bg-white border border-gray-200 rounded-xl overflow-hidden hover:border-py-blue/30 transition-all duration-300 group flex flex-col h-full">
    <div class="relative p-6 flex flex-col flex-grow z-10">
        <!-- Difficulty badge -->
        <span class="badge-{{ tutorial.difficulty }} self-start mb-3">{{ tutorial.get_difficulty_display }}</span>

        <h3 class="font-display text-xl font-bold text-py-navy mb-2 group-hover:text-py-blue transition-colors">
            <a href="{{ tutorial.get_absolute_url }}">{{ tutorial.title }}</a>
        </h3>

        <p class="text-gray-500 text-sm flex-grow mb-4 line-clamp-3">{{ tutorial.excerpt }}</p>

        <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-100">
            <span class="text-xs text-gray-400 font-display">
                <svg class="w-4 h-4 inline mr-1 text-py-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                {{ tutorial.reading_time }} min read
            </span>
            <a href="{{ tutorial.get_absolute_url }}" class="text-py-blue text-sm font-display font-semibold hover:text-py-yellow-dark transition-colors flex items-center gap-1">
                Read
                <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
            </a>
        </div>
    </div>
</article>
