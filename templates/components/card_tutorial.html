<article class="bg-white border-2 border-shield-navy transition-all duration-200 shadow-brutal hover:shadow-brutal-hover hover:translate-x-[2px] hover:translate-y-[2px] group flex flex-col h-full">
    <div class="relative p-6 flex flex-col flex-grow z-10">
        <!-- Difficulty badge -->
        <span class="font-mono text-xs font-bold uppercase tracking-widest px-2.5 py-1 border-2 border-shield-navy bg-shield-blue text-white self-start mb-3">{{ tutorial.get_difficulty_display }}</span>

        <h3 class="font-display text-2xl font-bold text-shield-navy mb-2 uppercase tracking-tight group-hover:text-shield-blue transition-colors">
            <a href="{{ tutorial.get_absolute_url }}">{{ tutorial.title }}</a>
        </h3>

        <p class="font-body text-shield-navy text-sm font-medium flex-grow mb-4 leading-relaxed line-clamp-3">{{ tutorial.excerpt }}</p>

        <div class="flex items-center justify-between mt-auto pt-4 border-t-2 border-shield-navy font-mono text-xs font-bold text-shield-navy">
            <span class="inline-flex items-center gap-1">
                <svg class="w-4 h-4 text-shield-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                {{ tutorial.reading_time }} min read
            </span>
            <a href="{{ tutorial.get_absolute_url }}" class="btn-orange text-xs py-1 px-3">
                Read »
            </a>
        </div>
    </div>
</article>
