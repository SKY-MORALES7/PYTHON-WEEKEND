{% comment %}
Usage: {% include "components/card-blog.html" with post=post %}
{% endcomment %}
<article class="bg-white border border-gray-200 rounded-xl overflow-hidden hover:border-py-blue/30 transition-all duration-300 hover:shadow-lg hover:shadow-py-blue/5 flex flex-col">
  {% if post.cover_image %}
  <a href="{% url 'content:blog_detail' post.slug %}">
    <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="w-full h-44 object-cover" loading="lazy" />
  </a>
  {% endif %}
  <div class="p-5 flex flex-col flex-1">
    <div class="flex items-center gap-2 mb-3">
      <span class="text-xs font-semibold text-py-blue uppercase tracking-widest">Blog</span>
      <span class="text-gray-400 text-xs">· {{ post.published_at|date:"M j, Y" }}</span>
    </div>
    <h3 class="font-display font-bold text-py-navy text-lg leading-snug mb-2">
      <a href="{% url 'content:blog_detail' post.slug %}" class="hover:text-py-blue transition-colors">{{ post.title }}</a>
    </h3>
    <p class="text-gray-500 text-sm leading-relaxed flex-1">{{ post.excerpt|truncatewords:20 }}</p>
    <a href="{% url 'content:blog_detail' post.slug %}" class="mt-4 inline-flex items-center gap-1 text-py-blue text-sm font-medium hover:gap-2 transition-all">
      Read more
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </a>
  </div>
</article>
