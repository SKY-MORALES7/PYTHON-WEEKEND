{% comment %}
Usage: {% include "components/card-blog.html" with post=post %}
{% endcomment %}
<article class="bg-white border-2 border-shield-navy transition-all duration-300 flex flex-col group">
  {% if post.cover_image %}
  <a href="{% url 'content:blog_detail' post.slug %}" class="border-b-2 border-shield-navy block relative overflow-hidden">
    <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="w-full h-44 object-cover filter grayscale group-hover:grayscale-0 transition-all duration-500" loading="lazy" />
  </a>
  {% endif %}
  <div class="p-6 flex flex-col flex-1">
    <div class="flex items-center gap-2 mb-4 font-mono">
      <span class="text-xs font-bold text-shield-navy uppercase tracking-widest bg-shield-ice px-2 py-1 border-2 border-shield-navy">Blog</span>
      <span class="text-shield-navy font-bold text-xs px-2 py-1 border-2 border-transparent">· {{ post.published_at|date:"M j, Y" }}</span>
    </div>
    <h3 class="font-display font-bold text-shield-navy text-2xl leading-none mb-3 uppercase tracking-tight">
      <a href="{% url 'content:blog_detail' post.slug %}" class="hover:underline underline-offset-4 decoration-2">{{ post.title }}</a>
    </h3>
    <p class="font-body text-shield-navy text-sm font-medium leading-relaxed flex-1">{{ post.excerpt|truncatewords:20 }}</p>
    <a href="{% url 'content:blog_detail' post.slug %}" class="mt-6 font-mono text-xs font-bold uppercase tracking-widest inline-flex items-center gap-2 text-shield-navy hover:text-shield-blue transition-colors group-hover:text-shield-blue">
      Read more
      <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" d="M9 5l7 7-7 7"/></svg>
    </a>
  </div>
</article>
