{% load static %}
<nav class="pw-navbar" id="pw-navbar">
  <div class="pw-navbar__inner">

    <!-- Logo -->
    <a href="{% url 'core:home' %}" class="pw-navbar__logo">
      <span class="pw-logo-heart">♥</span>
      <span class="pw-logo-text">python <strong>weekend</strong></span>
    </a>

    <!-- Desktop Links -->
    <div class="pw-navbar__links" id="pw-nav-links">
      <a href="{% url 'content:event_list' %}">Events</a>

      <div class="pw-dropdown">
        <button class="pw-dropdown__toggle">
          Learn
          <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="pw-dropdown__menu">
          <a href="{% url 'content:tutorial_list' %}">Tutorials</a>
          <a href="{% url 'content:blog_list' %}">Blog</a>
        </div>
      </div>

      <div class="pw-dropdown">
        <button class="pw-dropdown__toggle">
          Community
          <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="pw-dropdown__menu">
          <a href="{% url 'coach:list' %}">Coaches</a>
          <a href="{% url 'sponsors:list' %}">Sponsors</a>
          <a href="{% url 'core:about' %}">About</a>
        </div>
      </div>

      <a href="{% url 'applications:organize_start' %}">Volunteer</a>
      <a href="{% url 'core:contact' %}">Contact us</a>
    </div>

    <!-- Hamburger -->
    <button class="pw-navbar__hamburger" id="pw-hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Mobile menu -->
  <div class="pw-navbar__mobile" id="pw-mobile-menu">
    <a href="{% url 'core:home' %}">Home</a>
    <a href="{% url 'content:event_list' %}">Events</a>
    <a href="{% url 'content:tutorial_list' %}">Tutorials</a>
    <a href="{% url 'content:blog_list' %}">Blog</a>
    <a href="{% url 'coach:list' %}">Coaches</a>
    <a href="{% url 'sponsors:list' %}">Sponsors</a>
    <a href="{% url 'core:about' %}">About</a>
    <a href="{% url 'applications:organize_start' %}">Volunteer</a>
    <a href="{% url 'core:contact' %}">Contact us</a>
  </div>
</nav>

<script>
  const hamburger = document.getElementById('pw-hamburger');
  const mobileMenu = document.getElementById('pw-mobile-menu');
  hamburger.addEventListener('click', () => {
    mobileMenu.classList.toggle('pw-navbar__mobile--open');
    hamburger.classList.toggle('pw-navbar__hamburger--open');
  });

  // Sticky navbar shadow on scroll
  window.addEventListener('scroll', () => {
    const navbar = document.getElementById('pw-navbar');
    navbar.classList.toggle('pw-navbar--scrolled', window.scrollY > 10);
  });

  // Dropdown hover on desktop
  document.querySelectorAll('.pw-dropdown').forEach(el => {
    el.addEventListener('mouseenter', () => el.classList.add('pw-dropdown--open'));
    el.addEventListener('mouseleave', () => el.classList.remove('pw-dropdown--open'));
  });
</script>
