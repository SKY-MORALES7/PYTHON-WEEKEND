{% comment %}
Decorative animated blobs for hero sections.
Usage: {% include "components/blobs.html" %}
Wrap parent in position-relative with overflow-hidden.
{% endcomment %}
<div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
  <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-py-blue/10 blur-3xl animate-pulse"></div>
  <div class="absolute top-1/2 -right-24 w-80 h-80 rounded-full bg-py-yellow/10 blur-3xl" style="animation: pulse 8s ease-in-out 2s infinite;"></div>
  <div class="absolute bottom-0 left-1/3 w-64 h-64 rounded-full bg-py-blue-dark/8 blur-3xl" style="animation: pulse 10s ease-in-out 1s infinite;"></div>
</div>
