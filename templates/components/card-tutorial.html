{% comment %}
Usage: {% include "components/card-tutorial.html" with tutorial=tutorial %}
{% endcomment %}
<article class="bg-white border border-gray-200 rounded-xl p-5 hover:border-py-blue/30 transition-all duration-300 hover:shadow-lg hover:shadow-py-blue/5 flex flex-col gap-3">
  <div class="flex items-start justify-between gap-3">
    <div class="w-10 h-10 rounded-lg bg-py-blue/10 flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-py-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
      </svg>
    </div>
    {% if tutorial.difficulty %}
    <span class="text-xs px-2 py-0.5 rounded-full border
      {% if tutorial.difficulty == 'beginner' %}border-green-500/40 text-green-600
      {% elif tutorial.difficulty == 'intermediate' %}border-yellow-500/40 text-yellow-600
      {% else %}border-red-400/40 text-red-500{% endif %}">
      {{ tutorial.get_difficulty_display }}
    </span>
    {% endif %}
  </div>
  <div>
    <h3 class="font-display font-bold text-py-navy text-base leading-snug mb-1">
      <a href="{% url 'content:tutorial_detail' tutorial.slug %}" class="hover:text-py-blue transition-colors">{{ tutorial.title }}</a>
    </h3>
    <p class="text-gray-500 text-sm leading-relaxed">{{ tutorial.excerpt|truncatewords:18 }}</p>
  </div>
  <a href="{% url 'content:tutorial_detail' tutorial.slug %}" class="mt-auto inline-flex items-center gap-1 text-py-blue text-sm font-medium hover:gap-2 transition-all">
    Start tutorial
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
  </a>
</article>
