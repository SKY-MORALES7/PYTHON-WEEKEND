{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Python Weekend — free hands-on Python and Django workshops for beginners." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <title>{% block title %}Python Weekend{% endblock %}</title>

  <!-- Google Fonts: Covered By Your Grace (handwriting) + Lato (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Python Weekend Theme -->
  <link rel="stylesheet" href="{% static 'css/pythonweekend-theme.css' %}">

  {% block extra_head %}{% endblock %}
</head>

<body>

  {% include "components/navbar.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "components/footer.html" %}

  {% block extra_js %}{% endblock %}
</body>
</html>
