{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Become an Organiser{% endblock %} | Python Weekend</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            py: {
              blue: "#4B8BBE",
              "blue-dark": "#306998",
              yellow: "#FFD43B",
              "yellow-dark": "#C9A227",
              navy: "#16213E",
              light: "#f8f9fa",
              body: "#4a4a4a",
              muted: "#6c757d",
            },
          },
          fontFamily: {
            display: ['"Rajdhani"', "sans-serif"],
            body: ['"DM Sans"', "sans-serif"],
          },
        },
      },
    }
  </script>

  <!-- Google Fonts: Rajdhani (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Custom checkbox styling */
    .wizard-check {
      accent-color: #4B8BBE;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .wizard-radio {
      accent-color: #4B8BBE;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    /* Links in blue */
    .wizard-link {
      color: #4B8BBE;
      text-decoration: none;
      font-weight: 600;
    }
    .wizard-link:hover {
      text-decoration: underline;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 font-body text-gray-800 min-h-screen">

  <!-- Progress bar -->
  <div class="w-full bg-gray-200 h-1.5">
    <div class="bg-py-blue h-1.5 transition-all duration-500"
         style="width: {{ step|default:1 }}{% widthratio step total_steps 100 %}%"></div>
  </div>

  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-12 sm:py-16">
    {% block wizard_content %}{% endblock %}
  </div>

  {% block extra_js %}{% endblock %}
</body>
</html>
